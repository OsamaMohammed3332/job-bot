# ============================================================
#  Job bot configuration
#
#  The bot fetches a SUPERSET of jobs (every track, every level)
#  and each Telegram subscriber filters it their own way with
#  /track and /level. So this file decides what the bot is
#  CAPABLE of finding; your friends decide what they receive.
# ============================================================

# How far back to look on each run.
#   3600 = 1 hour, 21600 = 6 hours, 86400 = 24 hours
# Generously larger than the polling interval so a delayed run
# never leaves a gap. Duplicates are removed anyway.
lookback_seconds: 21600

# Max jobs posted per run. Safety valve.
max_posts_per_run: 25

# Seconds between Telegram sends (avoids 429 rate limits)
send_delay: 1.2

# ------------------------------------------------------------
# TRACKS
#
# Each track is a career lane a subscriber can opt into with
# /track. Add another by copying the pattern - no code changes.
#
# geo_id is required. LinkedIn silently discards location strings
# it does not recognise and geolocates the caller instead, which
# on a GitHub runner means US jobs.
#   Egypt 106155005 | UAE 104305776 | Saudi 100459316
#
# There is no per-level search. LinkedIn's experience filter works
# per query, so covering 3 levels would triple the requests. The
# bot fetches every level and classifies by title instead.
# ------------------------------------------------------------
tracks:

  flutter:
    label: "Flutter / Mobile"
    searches:
      - { keywords: "flutter",           geo_id: 106155005 }
      - { keywords: "flutter developer", geo_id: 106155005 }
      - { keywords: "mobile developer",  geo_id: 106155005 }
      - { keywords: "mobile engineer",   geo_id: 106155005 }
      - { keywords: "android developer", geo_id: 106155005 }
      - { keywords: "ios developer",     geo_id: 106155005 }
      - { keywords: "react native",      geo_id: 106155005 }
      - { keywords: "flutter dart",      geo_id: 106155005 }

    # Strict list - used for the remote job APIs, which return all
    # of software dev and would otherwise flood the track.
    title_must_include:
      - flutter
      - dart
      - mobile
      - android
      - ios
      - swift
      - kotlin
      - react native
      - react-native
      - cross-platform
      - cross platform
      - app developer
      - application developer
      - apps engineer

    # Broader list - used for LinkedIn, whose results already came
    # from a mobile-specific query. Mainly here so Arabic postings
    # such as "مهندس برمجيات" are not thrown away.
    title_must_include_linkedin:
      - flutter
      - dart
      - mobile
      - android
      - ios
      - swift
      - kotlin
      - react native
      - react-native
      - cross-platform
      - cross platform
      - app developer
      - application developer
      - apps engineer
      # Arabic
      - مهندس
      - مطور
      - برمجيات
      - تطبيقات
      - فلاتر
      - موبايل
      - اندرويد
      - أندرويد

  odoo:
    label: "Odoo / ERP"
    searches:
      - { keywords: "odoo",            geo_id: 106155005 }
      - { keywords: "odoo developer",  geo_id: 106155005 }
      - { keywords: "odoo functional", geo_id: 106155005 }
      - { keywords: "odoo implementation", geo_id: 106155005 }
      - { keywords: "erp developer",   geo_id: 106155005 }
      - { keywords: "python odoo",     geo_id: 106155005 }

    title_must_include:
      - odoo
      - openerp

    # "erp" alone is too loose on the APIs but fine on LinkedIn,
    # where the query already narrowed things down.
    title_must_include_linkedin:
      - odoo
      - openerp
      - erp
      # Arabic
      - أودو
      - اودو

# ------------------------------------------------------------
# GLOBAL FILTERS - applied to every track.
# ------------------------------------------------------------
filters:
  # ---- Geography gate -----------------------------------------
  # A job is kept only if it is EITHER in one of these home
  # locations OR its location says remote. Everything else goes.
  # This is what stops on-site roles in other countries.
  home_locations:
    - Egypt
    - Cairo
    - Giza
    - Al Jizah
    - Alexandria
    - Maadi
    - Qesm

  remote_markers:
    - remote
    - worldwide
    - anywhere
    - global

  # ---- Location blocklist -------------------------------------
  # "Remote" often means remote-from-one-country. Any job whose
  # location contains one of these is dropped.
  blocked_locations:
    - India
    - Pakistan
    - Bangladesh
    - Sri Lanka
    - Nepal
    - Philippines
    - Indonesia
    - Vietnam
    - Nigeria
    - Kenya
    - Ghana
    - Venezuela
    - Bolivia

  # Drop the job if the title contains any of these.
  # NOTE: junior/intern are NOT here any more - subscribers who
  # want junior roles select them with /level.
  title_must_not_include:
    - sales
    - recruiter
    - "talent acquisition"
    - "customer service"
    - accountant
    - teacher
    - instructor
    - "business development"

  blocked_companies: []

# ------------------------------------------------------------
# EXTRA SOURCES - free public APIs, no key needed.
# Each result is matched against every track's strict include
# list; anything matching no track is discarded.
# ------------------------------------------------------------
extra_sources:
  remotive: true    # remotive.com  - curated remote jobs
  remoteok: true    # remoteok.com  - remote tech jobs
  arbeitnow: true   # arbeitnow.com - EU + remote jobs
