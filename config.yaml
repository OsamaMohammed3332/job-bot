# ============================================================
#  Job bot configuration  —  Flutter / mobile, mid + senior
#  Egypt + remote worldwide
# ============================================================

# How far back to look on each run.
#   3600 = last hour, 7200 = 2 hours, 86400 = 24 hours
# Keep this LARGER than your cron interval so nothing slips through
# when a GitHub Actions run fires late.
lookback_seconds: 7200

# Max jobs posted per run. Safety valve.
max_posts_per_run: 25

# Seconds between Telegram sends (avoids 429 rate limits)
send_delay: 1.2

# IMPORTANT — always use geo_id, never a plain location string.
# LinkedIn silently discards location strings it does not recognise
# (e.g. "Worldwide") and falls back to geolocating whoever made the
# request. On a GitHub runner that means US jobs. geo_id is exact.
#
#   Egypt 106155005 | UAE 104305776 | Saudi 100459316
#   Germany 101282230 | UK 101165590 | USA 103644278
#
# There is no "remote: true" option any more. LinkedIn guest search
# accepts the remote flag (f_WT=2) and then ignores it — identical
# results come back with and without it. Worldwide remote roles come
# from the dedicated remote job boards under extra_sources instead.
searches:
  - { keywords: "flutter",           geo_id: 106155005, exp: [3, 4, 5] }
  - { keywords: "flutter developer", geo_id: 106155005, exp: [3, 4, 5] }
  - { keywords: "mobile developer",  geo_id: 106155005, exp: [3, 4, 5] }
  - { keywords: "mobile engineer",   geo_id: 106155005, exp: [3, 4, 5] }
  - { keywords: "android developer", geo_id: 106155005, exp: [3, 4, 5] }
  - { keywords: "ios developer",     geo_id: 106155005, exp: [3, 4, 5] }
  - { keywords: "react native",      geo_id: 106155005, exp: [3, 4, 5] }
  - { keywords: "flutter dart",      geo_id: 106155005, exp: [3, 4, 5] }
  - { keywords: "mobile application developer", geo_id: 106155005, exp: [3, 4, 5] }
  - { keywords: "cross platform mobile",        geo_id: 106155005, exp: [3, 4, 5] }

# ------------------------------------------------------------
# FILTERS applied to every result before posting.
#
# This is what keeps the extra remote-job APIs (Remotive, RemoteOK,
# Arbeitnow) from flooding you with backend and data roles — they
# return all of software dev, and this list narrows it to mobile.
# ------------------------------------------------------------
filters:
  # ---- Geography gate -----------------------------------------
  # A job is kept only if it is EITHER in one of your home locations
  # OR its location says it is remote. Everything else is dropped.
  #
  # This is what stops on-site roles in Malmo, Puteaux, Sao Paulo and
  # Kuala Lumpur reaching you. Set home_locations to [] if you ever
  # want remote-only and nothing local.
  home_locations:
    - Egypt
    - Cairo
    - Giza
    - Al Jizah
    - Alexandria
    - Maadi
    - Qesm

  remote_markers:
    - remote
    - worldwide
    - anywhere
    - global

  # ---- Location blocklist -------------------------------------
  # "Remote" rarely means remote-from-anywhere. A lot of worldwide
  # listings are really targeted at one low-cost market. Any job whose
  # location contains one of these strings is dropped.
  # Add or remove freely — it's a plain substring match.
  blocked_locations:
    - India
    - Pakistan
    - Bangladesh
    - Sri Lanka
    - Nepal
    - Philippines
    - Indonesia
    - Vietnam
    - Nigeria
    - Kenya
    - Ghana
    - Venezuela
    - Bolivia

  # ---- Title include list: NON-LinkedIn sources ---------------
  # Remotive / RemoteOK / Arbeitnow return all of software dev, so
  # these need a strict mobile-only list.
  title_must_include:
    - flutter
    - dart
    - mobile
    - android
    - ios
    - swift
    - kotlin
    - react native
    - react-native
    - cross-platform
    - cross platform
    - app developer
    - application developer
    - apps engineer

  # ---- Title include list: LinkedIn ---------------------------
  # LinkedIn results already came from a Flutter/mobile search query,
  # so the title doesn't need to re-prove it. This broader list exists
  # mainly so Arabic-language postings aren't thrown away — plenty of
  # Egyptian Flutter roles are posted as "مهندس برمجيات".
  title_must_include_linkedin:
    - flutter
    - dart
    - mobile
    - android
    - ios
    - swift
    - kotlin
    - react native
    - react-native
    - cross-platform
    - cross platform
    - app developer
    - application developer
    - apps engineer
    - engineer
    - developer
    - programmer
    # Arabic
    - مهندس
    - مطور
    - برمجيات
    - تطبيقات
    - فلاتر
    - موبايل
    - اندرويد
    - أندرويد

  # Drop the job if the title contains any of these.
  # Remove "junior" / "intern" here if you ever want entry-level too.
  title_must_not_include:
    - intern
    - internship
    - trainee
    - junior
    - fresh grad
    - graduate program
    - sales
    - recruiter
    - "talent acquisition"
    - "customer service"
    - accountant
    - teacher
    - instructor
    - "business development"

  # Drop jobs from these companies (spam agencies, etc.)
  blocked_companies: []

# ------------------------------------------------------------
# EXTRA SOURCES — free public APIs, no key needed.
# These add remote jobs that never show up on LinkedIn.
# ------------------------------------------------------------
extra_sources:
  remotive: true    # remotive.com  — curated remote jobs
  remoteok: true    # remoteok.com  — remote tech jobs
  arbeitnow: true   # arbeitnow.com — EU + remote jobs
